<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Who Said It?</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <button id="btn-mute" class="mute-toggle" aria-label="Mute sound">🔊</button>
  <main id="app">
    <section id="screen-join" class="screen active">
      <div class="join-card">
        <h1>Who Said It?</h1>
        <p class="subtitle">Guess who sent the message.</p>

        <label for="join-name">Your name</label>
        <input id="join-name" type="text" maxlength="32" placeholder="Talbot" autocomplete="off" />

        <button id="btn-create" class="btn-primary">Create a room</button>

        <div class="divider"><span>or join with a code</span></div>

        <div class="join-row">
          <input id="join-code" type="text" maxlength="4" placeholder="CODE" autocomplete="off" class="code-input" />
          <button id="btn-join" class="btn-secondary">Join</button>
        </div>

        <p id="join-error" class="error"></p>
      </div>
    </section>

    <section id="screen-lobby" class="screen">
      <h2>Room <span id="lobby-code"></span></h2>
      <ul id="lobby-players"></ul>
      <ul id="lobby-color-legend" class="color-legend"></ul>
      <div id="host-controls" class="hidden">
        <label>Rounds
          <input id="opt-rounds" type="number" min="3" max="50" value="15" />
        </label>
        <label>Seconds per round
          <input id="opt-seconds" type="number" min="5" max="60" value="20" />
        </label>
        <label>Quote pool
          <select id="opt-pool">
            <option value="mixed" selected>Mixed</option>
            <option value="funny">Funniest</option>
            <option value="interesting">Most interesting</option>
          </select>
        </label>
        <label class="checkbox-label">
          <input id="opt-show-year" type="checkbox" />
          Show year during round (hint)
        </label>
        <button id="btn-start">Start game</button>
      </div>
      <p id="lobby-waiting" class="subtitle">Waiting for the host to start...</p>
    </section>

    <section id="screen-round" class="screen">
      <div class="round-header">
        <span id="round-count"></span>
        <div id="round-timer-bar"><div id="round-timer-fill"></div></div>
        <span id="round-answered"></span>
      </div>
      <blockquote id="round-quote"></blockquote>
      <span id="round-year" class="year-badge hidden"></span>
      <div id="round-choices" class="choices"></div>
    </section>

    <section id="screen-reveal" class="screen">
      <h2 id="reveal-heading"></h2>
      <blockquote id="reveal-quote"></blockquote>
      <p id="reveal-date" class="subtitle"></p>
      <button id="btn-downvote" class="btn-downvote">👎 Bad quote <span id="downvote-count"></span></button>
      <ul id="reveal-guesses"></ul>
      <h3>Scoreboard</h3>
      <ol id="reveal-scores"></ol>
      <button id="btn-next" class="hidden">Next round</button>
      <p id="reveal-waiting" class="subtitle hidden">Waiting for host to continue...</p>
    </section>

    <section id="screen-gameover" class="screen">
      <h2>Final scores</h2>
      <ol id="final-scores"></ol>
      <div id="predictability-board" class="predictability-board hidden">
        <h3>Predictability Board <span class="subtitle">(all-time)</span></h3>
        <ul id="predictability-list"></ul>
      </div>
      <button id="btn-again" class="hidden">Play again</button>
      <p id="gameover-waiting" class="subtitle hidden">Waiting for host...</p>
    </section>
  </main>

  <script src="/socket.io/socket.io.js"></script>
  <script src="sound.js"></script>
  <script src="effects.js"></script>
  <script src="app.js"></script>
</body>
</html>
